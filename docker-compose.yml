version: '3.8'

services:

  app:
    container_name: f2fcore
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"
      - "5006:5006"
    depends_on:
      - db
      - redis

  db:
    image: postgres:13
    container_name: postgres-f2fdb
    environment:
      POSTGRES_USER: f2fuser
      POSTGRES_PASSWORD: f2fpass
      POSTGRES_DB: f2fdb
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: redis-f2fdb
    ports:
      - "6379:6379"

volumes:
  pg_data:
