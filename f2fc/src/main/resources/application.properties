server.port=8080
server.servlet.context-path=/

spring.thymeleaf.cache=false
spring.task.scheduling.pool.size=8

server.tomcat.accesslog.directory=/data/logs/f2f-server
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.rename-on-rotate=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.use-new-productId-generator-mappings=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

signin.failure.max=5
jwt.jks.keypass=keypass

oauth2.granttype.password.captcha=false
oauth2.issuer-uri=http://server.sso.com
captcha.max.times=5

dozer.mapping-files=classpath:dozer/mapper.xml

thirdparty.weixin.mini.appid=
thirdparty.weixin.mini.secret=

spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB

spring.main.allow-bean-definition-overriding=true

spring.messages.encoding=UTF-8
spring.messages.basename=messages

api.prefix=/api

# JWT Public Key
security.jwt.rsa-public-

##set the default profile for running/debug
spring.profiles.active=dev