#\u9879\u76EE\u542F\u52A8\u7AEF\u53E3,\u9ED8\u8BA48080
#server.port=10380
server.port=8080
server.servlet.context-path=/

spring.thymeleaf.cache=false
spring.task.scheduling.pool.size=8

server.tomcat.accesslog.directory=/data/logs/f2f-server
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.rename-on-rotate=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.use-new-productId-generator-mappings=true
#spring.jpa.show-sql=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

signin.failure.max=5
jwt.jks.keypass=keypass
#oauth2 password\u6A21\u5F0F\u662F\u5426\u542F\u7528\u56FE\u5F62\u9A8C\u8BC1\u7801
oauth2.granttype.password.captcha=false
#oauth2 issuer
oauth2.issuer-uri=http://server.sso.com
#\u9A8C\u8BC1\u7801\u6700\u5927\u5C1D\u8BD5\u6B21\u6570
captcha.max.times=5

#dozer
dozer.mapping-files=classpath:dozer/mapper.xml

thirdpa\u8BBF\u95EE\u88AB\u62D2\u7EDDrty.weixin.mini.appid=
thirdparty.weixin.mini.secret=


##file upload settings
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB
storage.location=C:/newProjects/f2fcore/upload/images

##enable/disable application security with profiles
spring.profiles.active=dev

##add the following config for run multimodule and jpa error on startup
spring.main.allow-bean-definition-overriding=true

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true


## bundle
spring.messages.encoding=UTF-8
spring.messages.basename=messages
